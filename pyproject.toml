[tool.poetry]
name = "autoloom-2"
version = "2.0.0"
description = "Autoloom-2: AI text generation and classification system with full sequence context"
authors = ["Cassandra Melax <cassandra@melax.ai>"]
packages = [{include = "lui"}]

[tool.poetry.dependencies]
python = "^3.8"
textual = "^0.27.0"
openai = "^1.3.0"
rich = "^13.0.0"
aiohttp = "^3.8.0"
requests = "^2.32.3"
pyperclip = "^1.9.0"
python-dotenv = "^1.0.1"

[tool.poetry.scripts]
lui = "lui.main:main"
tuni = "tuni.main:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"